[project]
name = "helel-ml"
version = "0.1.0"
description = "Local training and inference research for Helel models"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
helel-data = "helel_ml.pipeline:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
