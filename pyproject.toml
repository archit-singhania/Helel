[project]
name = "helel-ml"
version = "0.1.0"
description = "Local training and inference research for Helel models"
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
helel-data = "helel_ml.pipeline:main"
helel-smoke-train = "helel_ml.smoke:main"
helel-product-smoke = "helel_ml.product_smoke:main"
helel-inference = "helel_ml.inference:main"
helel-train = "helel_ml.train_cli:main"
helel-tool-traces = "helel_ml.tool_traces:main"
helel-agent-eval = "helel_ml.agent_eval:main"

[project.optional-dependencies]
training = ["mlx>=0.31,<0.32"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
